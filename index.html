<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonComptoir Pro</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body>
    <header>
        <h1>MonComptoir Pro</h1>
    </header>
    <main id="app">
        <section>
            <h2>Your Financial Management App</h2>
            <div id="auth">
                <button id="login">Login</button>
                <button id="sign-up">Sign Up</button>
            </div>
            <div id="data-display">
                <h3>Your Data</h3>
                <div id="data" class="data-container"></div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 MonComptoir Pro. All rights reserved.</p>
    </footer>
    <script>
        const supabaseUrl = 'https://your-project.supabase.co';
        const supabaseKey = 'your-public-anon-key';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('login').onclick = async () => {
            const { user, error } = await supabase.auth.signIn({
                provider: 'google',
            });
            console.log(user, error);
        };

        document.getElementById('sign-up').onclick = async () => {
            const { user, error } = await supabase.auth.signUp({
                email: 'email@example.com',
                password: 'password',
            });
            console.log(user, error);
        };

        const fetchData = async () => {
            let { data: items, error } = await supabase
                .from('financial_data')
                .select('*');
            if (error) console.error('Error fetching data:', error);
            document.getElementById('data').innerHTML = JSON.stringify(items);
        };

        // Fetch data on load
        fetchData();
    </script>
</body>
</html>
